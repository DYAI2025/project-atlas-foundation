<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Project ATLAS Foundation architecture</title>
  <desc id="desc">Isometric architecture overview separating the implemented local pilot from the later production target. The current path runs from governed Confluence source through verified capture, deterministic GBrain projection, persisted readback and validation into the WebGL Semantic Atlas workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#09111f"/><stop offset="1" stop-color="#121b2f"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#1e69d2"/><stop offset="1" stop-color="#51a9ff"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#c28b2c"/><stop offset="1" stop-color="#f1c86b"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop offset="0" stop-color="#6044b8"/><stop offset="1" stop-color="#a889ff"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop offset="0" stop-color="#247b66"/><stop offset="1" stop-color="#54c7a4"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8ea3c7"/></marker>
    <style>
      .kicker{font:700 14px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:2.5px;text-transform:uppercase;fill:#7f96bc}.h1{font:700 36px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f6f8fc}.sub{font:400 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#aebbd3}.plane-title{font:700 13px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:1.7px;text-transform:uppercase;fill:#dbe6f8}.node-title{font:700 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}.node-copy{font:400 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#d8e1f0}.micro{font:600 11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#8da3c6}.target-title{font:700 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#e7eaf2}.target-copy{font:400 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#aab4c8}.edge{stroke:#8ea3c7;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}.badge{font:700 11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#09111f}
    </style>
  </defs>
  <rect width="1400" height="920" rx="28" fill="url(#bg)"/>
  <circle cx="1190" cy="110" r="230" fill="#214884" opacity=".10"/><circle cx="230" cy="760" r="260" fill="#684aa4" opacity=".08"/>
  <text x="70" y="72" class="kicker">PROJECT ATLAS FOUNDATION</text>
  <text x="70" y="116" class="h1">Governed knowledge → inspectable graph</text>
  <text x="70" y="148" class="sub">Current local pilot in solid layers · production target intentionally separated below</text>

  <!-- source plane -->
  <g filter="url(#shadow)">
    <polygon points="90,250 370,190 570,250 290,310" fill="#152641" stroke="#385378" stroke-width="1.5"/>
    <polygon points="290,310 570,250 570,292 290,352" fill="#0d182a" stroke="#385378"/>
    <polygon points="90,250 290,310 290,352 90,292" fill="#101e33" stroke="#385378"/>
  </g>
  <text x="112" y="236" class="plane-title">01 · GOVERNED SOURCE</text>
  <rect x="150" y="232" width="230" height="76" rx="14" fill="url(#blue)"/>
  <text x="170" y="260" class="node-title">Confluence source set</text><text x="170" y="282" class="node-copy">Page identity · revision · hierarchy</text><text x="170" y="299" class="node-copy">verified before capture</text>
  <rect x="405" y="225" width="122" height="54" rx="12" fill="#203552" stroke="#55739d"/>
  <text x="420" y="248" class="node-title" font-size="13">Project scope</text><text x="420" y="267" class="node-copy">explicit registry</text>

  <!-- projection plane -->
  <g filter="url(#shadow)">
    <polygon points="430,390 850,300 1085,370 665,460" fill="#1b1e3c" stroke="#554f82" stroke-width="1.5"/>
    <polygon points="665,460 1085,370 1085,414 665,504" fill="#111329" stroke="#554f82"/>
    <polygon points="430,390 665,460 665,504 430,434" fill="#151831" stroke="#554f82"/>
  </g>
  <text x="464" y="369" class="plane-title">02 · VERIFIED PROJECTION</text>
  <rect x="500" y="365" width="182" height="78" rx="14" fill="url(#violet)"/>
  <text x="520" y="393" class="node-title">Verified capture</text><text x="520" y="415" class="node-copy">all-or-nothing source set</text><text x="520" y="432" class="node-copy">fail closed on drift</text>
  <rect x="705" y="341" width="190" height="78" rx="14" fill="#7154c7"/>
  <text x="725" y="369" class="node-title">Deterministic map</text><text x="725" y="391" class="node-copy">explicit hierarchy only</text><text x="725" y="408" class="node-copy">provenance travels with data</text>
  <rect x="920" y="326" width="128" height="70" rx="14" fill="#433965" stroke="#8b75c6"/>
  <text x="938" y="353" class="node-title">Pinned</text><text x="938" y="374" class="node-copy">GBrain + PGLite</text>

  <!-- read plane -->
  <g filter="url(#shadow)">
    <polygon points="580,570 1000,480 1230,550 810,640" fill="#183332" stroke="#3a7168" stroke-width="1.5"/>
    <polygon points="810,640 1230,550 1230,594 810,684" fill="#102322" stroke="#3a7168"/>
    <polygon points="580,570 810,640 810,684 580,614" fill="#132a29" stroke="#3a7168"/>
  </g>
  <text x="615" y="548" class="plane-title">03 · TRUSTED READ SIDE</text>
  <rect x="650" y="544" width="180" height="78" rx="14" fill="#278b73"/>
  <text x="670" y="572" class="node-title">Persisted readback</text><text x="670" y="594" class="node-copy">cannot re-fetch source</text><text x="670" y="611" class="node-copy">derived state only</text>
  <rect x="852" y="520" width="175" height="78" rx="14" fill="url(#green)"/>
  <text x="872" y="548" class="node-title">gbrain-read/v1</text><text x="872" y="570" class="node-copy">scope + contract gate</text><text x="872" y="587" class="node-copy">invalid graph refused</text>
  <rect x="1045" y="506" width="145" height="67" rx="14" fill="#275a54" stroke="#56b4a2"/>
  <text x="1063" y="533" class="node-title">Provenance</text><text x="1063" y="554" class="node-copy">revision · URL · time</text>

  <!-- experience plane -->
  <g filter="url(#shadow)">
    <polygon points="170,545 465,480 625,530 330,595" fill="#372a16" stroke="#80663b" stroke-width="1.5"/>
    <polygon points="330,595 625,530 625,574 330,639" fill="#231b0f" stroke="#80663b"/>
    <polygon points="170,545 330,595 330,639 170,589" fill="#2b2112" stroke="#80663b"/>
  </g>
  <text x="198" y="524" class="plane-title">04 · INSPECTABLE EXPERIENCE</text>
  <rect x="220" y="530" width="230" height="84" rx="14" fill="url(#gold)"/>
  <text x="241" y="558" class="node-title" fill="#1a1408">Semantic Atlas</text><text x="241" y="580" class="node-copy" fill="#2c2417">WebGL · search · focus</text><text x="241" y="598" class="node-copy" fill="#2c2417">zoom · pan · evidence inspector</text>
  <rect x="470" y="512" width="116" height="62" rx="12" fill="#5b4928" stroke="#d9b45f"/>
  <text x="487" y="538" class="node-title">Accessible</text><text x="487" y="559" class="node-copy">DOM overlay</text>

  <!-- edges current -->
  <path class="edge" d="M373 294 C440 315 470 342 515 365"/>
  <path class="edge" d="M682 397 C700 392 704 387 714 382"/>
  <path class="edge" d="M895 378 C915 373 922 368 931 365"/>
  <path class="edge" d="M983 396 C960 462 815 503 770 545"/>
  <path class="edge" d="M830 581 C842 578 850 572 862 568"/>
  <path class="edge" d="M1027 557 C1040 553 1047 548 1057 545"/>
  <path class="edge" d="M870 603 C735 670 520 667 424 611"/>
  <rect x="622" y="648" width="176" height="24" rx="12" fill="#d9e7f8"/><text x="637" y="665" class="badge">accepted bytes + evidence</text>

  <!-- target boundary -->
  <rect x="70" y="735" width="1260" height="125" rx="20" fill="#111827" stroke="#687386" stroke-width="1.5" stroke-dasharray="9 8"/>
  <text x="95" y="766" class="plane-title">PRODUCTION TARGET · NOT CLAIMED BY THE LOCAL PILOT</text>
  <rect x="100" y="788" width="250" height="48" rx="12" fill="#202938" stroke="#58677b"/><text x="118" y="811" class="target-title">ATLAS canonical control plane</text><text x="118" y="828" class="target-copy">proposals · approval evidence · audit</text>
  <rect x="380" y="788" width="245" height="48" rx="12" fill="#202938" stroke="#58677b"/><text x="398" y="811" class="target-title">PostgreSQL + project_id + RLS</text><text x="398" y="828" class="target-copy">canonical isolation · service roles</text>
  <rect x="655" y="788" width="245" height="48" rx="12" fill="#202938" stroke="#58677b"/><text x="673" y="811" class="target-title">Approval / publish separation</text><text x="673" y="828" class="target-copy">distinct human-authority identities</text>
  <rect x="930" y="788" width="365" height="48" rx="12" fill="#202938" stroke="#58677b"/><text x="948" y="811" class="target-title">Reconciled GBrain projection → read consumers</text><text x="948" y="828" class="target-copy">checkpoints · lag · rebuild · MCP / search / graph UI</text>
  <path class="edge dash" d="M350 812 L375 812"/><path class="edge dash" d="M625 812 L650 812"/><path class="edge dash" d="M900 812 L925 812"/>

  <text x="70" y="895" class="micro">Architecture source of truth: architecture/architecture.json · This SVG is a derived communication view · Current implementation and target architecture are deliberately not conflated.</text>
</svg>
